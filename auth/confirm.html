<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOAKY – E-Mail bestätigen</title>
  <!-- Auth-Fallback: keine Indexierung, und Query/Fragment (Tokens) nie als
       Referrer weitergeben. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-open {
      display: inline-block;
      margin-top: var(--space-md);
      padding: 0.9rem 1.75rem;
      border-radius: 999px;
      background: var(--boaky-blue);
      color: var(--boaky-cream);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-open:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="/">
        <img
          src="/assets/img/boaky-logo-primary.png"
          alt="BOAKY"
          width="1672"
          height="940"
        />
      </a>
    </div>
  </header>

  <main id="main" class="legal-main">
    <div class="container">
      <h1>E-Mail bestätigen</h1>
      <p class="legal-intro">
        Öffne diesen Link auf deinem Smartphone mit BOAKY, um deine
        E-Mail-Adresse zu bestätigen.
      </p>
      <a class="auth-open" id="open-in-app" href="boaky://auth/confirm">In BOAKY öffnen</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-brand">
        <img
          src="/assets/img/boaky-logo-primary.png"
          alt="BOAKY"
          width="1672"
          height="940"
        />
        <span>Deine Favoriten. An einem Ort.</span>
      </p>
      <ul class="footer-links">
        <li><a href="/support.html">Support</a></li>
        <li><a href="/datenschutz.html">Datenschutz</a></li>
        <li><a href="/nutzungsbedingungen.html">Nutzungsbedingungen</a></li>
        <li><a href="/account-loeschen.html">Account löschen</a></li>
        <li><a href="/impressum.html">Impressum</a></li>
      </ul>
    </div>
  </footer>

  <script>
    // Query (z. B. token_hash, type) und Fragment (z. B. access_token,
    // error_code) unverändert an das App-Scheme durchreichen.
    document.getElementById("open-in-app").href =
      "boaky://auth/confirm" + window.location.search + window.location.hash;
  </script>
</body>
</html>
